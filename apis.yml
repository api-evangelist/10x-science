aid: 10x-science
name: 10x Science
description: '10x Science is an AI-native software company building the first AI-native
  protein characterization platform for the life sciences, starting with drug development.
  A Y Combinator W26 company founded out of Nobel laureate Carolyn Bertozzi''s laboratory
  at Stanford University, it automates peptide mapping for protein therapeutics, delivering
  explainable molecular insights in minutes where legacy tools and manual workflows
  take months. The company raised a $4.8M seed round led by Initialized Capital and
  is headquartered in the San Francisco Bay Area. This API Evangelist profile tracks
  the company; it does not yet publish a public developer API.'
